name: Generate mobile lockfile
on:
  push:
    branches: [main]
    paths:
      - "pwa/package.json"
      - ".github/workflows/mobile-lockfile.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package.json
      - name: Generate deterministic dependency lock
        working-directory: pwa
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pwa/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/package-lock.json
          git commit -m "build(mobile): add npm lockfile"
          git push origin HEAD:main
