name: Build Axiom iOS and publish TestFlight

on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Capacitor iOS app and Share Extension
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install mobile dependencies
        working-directory: pwa
        run: npm ci

      - name: Audit production dependencies
        working-directory: pwa
        run: npm audit --omit=dev

      - name: Build shared React application
        working-directory: pwa
        run: npm run build

      - name: Generate Capacitor iOS project
        working-directory: pwa
        run: npx cap add ios

      - name: Configure native Keychain, speech, documents and Share Extension
        working-directory: pwa
        run: |
          ruby -v
          gem install xcodeproj --no-document
          npm run ios:configure
          npx cap sync ios

      - name: Build unsigned iOS simulator application
        working-directory: pwa
        run: |
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AxiomDerivedData" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="$RUNNER_TEMP/AxiomDerivedData/Build/Products/Release-iphonesimulator/App.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Axiom-iOS-Simulator.zip"

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: axiom-ios-simulator-${{ github.run_number }}
          path: ${{ runner.temp }}/Axiom-iOS-Simulator.zip
          if-no-files-found: error

      - name: Import Apple distribution certificate
        if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_TEAM_ID != '' && env.ASC_API_KEY_ID != '' && env.ASC_API_ISSUER_ID != '' && env.ASC_API_KEY_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.IOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ env.IOS_CERTIFICATE_PASSWORD }}

      - name: Prepare App Store Connect API key
        if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_TEAM_ID != '' && env.ASC_API_KEY_ID != '' && env.ASC_API_ISSUER_ID != '' && env.ASC_API_KEY_BASE64 != ''
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Archive signed iOS app
        if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_TEAM_ID != '' && env.ASC_API_KEY_ID != '' && env.ASC_API_ISSUER_ID != '' && env.ASC_API_KEY_BASE64 != ''
        working-directory: pwa
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Axiom.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Export App Store IPA
        if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_TEAM_ID != '' && env.ASC_API_KEY_ID != '' && env.ASC_API_ISSUER_ID != '' && env.ASC_API_KEY_BASE64 != ''
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Axiom.xcarchive" \
            -exportPath "$RUNNER_TEMP/AxiomExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Upload IPA artifact
        if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_TEAM_ID != '' && env.ASC_API_KEY_ID != '' && env.ASC_API_ISSUER_ID != '' && env.ASC_API_KEY_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: axiom-ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/AxiomExport/*.ipa
          if-no-files-found: error

      - name: Upload build to TestFlight
        if: startsWith(github.ref, 'refs/tags/ios-v') && env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_TEAM_ID != '' && env.ASC_API_KEY_ID != '' && env.ASC_API_ISSUER_ID != '' && env.ASC_API_KEY_BASE64 != ''
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/AxiomExport/Axiom.ipa" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
