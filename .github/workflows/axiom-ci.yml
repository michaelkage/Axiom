name: Axiom CI

on:
  push:
    branches:
      - main
      - "axiom/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: axiom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit-test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build standalone UI
        run: pnpm run build

      - name: Validate standalone desktop launcher
        run: node --check desktop/main.cjs

      - name: Verify standalone UI output
        run: test -f out/src/webview/standalone.html

      - name: Type-check standalone UI
        run: pnpm exec tsc -p tsconfig.webview.json

      - name: Run unit tests
        run: pnpm exec vitest run

      - name: Run desktop host tests
        run: pnpm run test:desktop

      - name: Install bundled runtime for end-to-end tests
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Run Playwright end-to-end tests
        run: PATH="$PWD/desktop/node_modules/.bin:$PATH" pnpm run test:e2e

  package-windows-desktop:
    name: Package Windows desktop installer
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone UI
        run: pnpm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-Windows-x64-installer
          path: desktop/release/Axiom-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 7
