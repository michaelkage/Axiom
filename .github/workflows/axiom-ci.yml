name: Axiom CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: axiom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit-test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Build standalone UI
        run: pnpm run build

      - name: Validate standalone desktop launcher
        run: node --check desktop/main.cjs

      - name: Verify standalone UI output
        run: test -f out/src/webview/standalone.html

      - name: Type-check standalone UI
        run: pnpm exec tsc -p tsconfig.webview.json

      - name: Run unit tests
        run: pnpm exec vitest run

      - name: Install PWA gateway test dependencies
        working-directory: pwa
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run PWA and gateway security tests
        working-directory: pwa
        run: npm test

      - name: Validate product site and release catalog
        run: pnpm run test:site

      - name: Run desktop host tests
        run: pnpm run test:desktop

      - name: Install bundled runtime for end-to-end tests
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Run Playwright end-to-end tests
        run: PATH="$PWD/desktop/node_modules/.bin:$PATH" pnpm run test:e2e

  package-windows-desktop:
    name: Package Windows desktop installer
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone UI
        run: pnpm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: Smoke-test installed desktop application on every pull request
        shell: pwsh
        timeout-minutes: 3
        run: |
          $installer = Get-ChildItem "desktop/release/Axiom-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced." }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer exited with code $($install.ExitCode)." }
          $exe = Join-Path $env:LOCALAPPDATA "Programs/Axiom/Axiom.exe"
          if (-not (Test-Path $exe)) {
            $candidate = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Filter "Axiom.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $exe = $candidate.FullName }
          }
          if (-not (Test-Path $exe)) { throw "Axiom.exe was not found after installation." }
          $workspace = Join-Path $env:RUNNER_TEMP "axiom-install-smoke"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $app = Start-Process -FilePath $exe -ArgumentList @("--axiom-workspace=$workspace", "--disable-gpu") -PassThru
          $runtimeLogCandidates = @((Join-Path $env:APPDATA "Axiom/logs/runtime.log"), (Join-Path $env:APPDATA "axiom-desktop/logs/runtime.log"))
          $deadline = (Get-Date).AddSeconds(60)
          $log = ""
          $runtimeReady = $false
          $rendererReady = $false
          $uiMounted = $false
          do {
            $app.Refresh()
            if ($app.HasExited) { throw "Installed Axiom exited during startup. $log" }
            $foundLog = $runtimeLogCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($foundLog) {
              $log = Get-Content $foundLog -Tail 120 | Out-String
              if ($log -match "Runtime executable lookup failed|Runtime process error|Runtime startup failed|could not start its local AI runtime") { throw "Installed Axiom reported a runtime startup failure. $log" }
              $runtimeReady = $log -match "Runtime ready at http://127\.0\.0\.1:"
              $rendererReady = $log -match "Axiom renderer loaded\."
              $uiMounted = $log -match "Axiom UI mounted\."
              if ($runtimeReady -and $rendererReady -and $uiMounted) { break }
            }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if (-not $runtimeReady -or -not $rendererReady -or -not $uiMounted) { throw "Installed Axiom did not complete runtime, renderer, and UI startup within 60 seconds. $log" }
          try { & taskkill.exe /pid $app.Id /t /f | Out-Null } catch {}
          $app.WaitForExit(10000) | Out-Null

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-Windows-x64-installer
          path: desktop/release/Axiom-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 7
