name: Axiom CI

on:
  push:
    branches:
      - main
      - "axiom/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: axiom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone UI
        run: pnpm run build

      - name: Validate standalone desktop launcher
        run: node --check desktop/main.cjs

      - name: Verify standalone UI output
        run: test -f out/src/webview/standalone.html

      - name: Type-check standalone UI
        run: pnpm exec tsc -p tsconfig.webview.json

      - name: Run unit tests
        run: pnpm exec vitest run

      - name: Run desktop host tests
        run: pnpm run test:desktop
