name: Axiom validation

on:
  pull_request:
    branches: [main, feat/five-milestone-implementation]
  push:
    branches: [feat/axiom-20-milestone-program]

permissions:
  contents: read

concurrency:
  group: axiom-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop runtime tests
        run: pnpm test:desktop
      - name: Unit, worker-host and browser tests
        run: pnpm test
      - name: Production webview build
        run: pnpm build
