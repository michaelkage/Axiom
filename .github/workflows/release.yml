name: Build Axiom Desktop Release

concurrency:
  group: axiom-desktop-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - "axiom/product-rebuild"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop release version (for example 0.4.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build standalone Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Axiom desktop UI
        run: pnpm run build:webview

      - name: Validate desktop launcher
        run: node --check desktop/main.cjs

      - name: Install desktop packaging dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Validate release version
        shell: pwsh
        run: |
          $desktopVersion = (Get-Content "desktop/package.json" -Raw | ConvertFrom-Json).version
          $rootVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          if ($desktopVersion -ne $rootVersion) { throw "Root package version $rootVersion does not match desktop/package.json version $desktopVersion" }
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = $desktopVersion
          }
          if ($version -ne $desktopVersion) { throw "Release version $version does not match desktop/package.json version $desktopVersion" }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }
          "AXIOM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/release/Axiom-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"

      - name: Check whether the version tag already exists
        id: release_tag
        if: github.ref == 'refs/heads/axiom/product-rebuild'
        shell: pwsh
        run: |
          $remoteTags = git ls-remote --tags origin
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect remote Git tags." }
          $tagRef = "refs/tags/v$env:AXIOM_VERSION"
          $matchingTag = $remoteTags | Select-String -SimpleMatch $tagRef
          if ($matchingTag) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Upload standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: axiom-standalone-windows-${{ env.AXIOM_VERSION }}
          path: |
            desktop/release/Axiom-Setup-*-x64.exe
            desktop/release/Axiom-Setup-*-x64.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/axiom/product-rebuild' && steps.release_tag.outputs.exists != 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.AXIOM_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Axiom ${{ env.AXIOM_VERSION }}
          generate_release_notes: true
          files: |
            desktop/release/Axiom-Setup-*-x64.exe
            desktop/release/Axiom-Setup-*-x64.exe.sha256
