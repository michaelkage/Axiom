name: Build Axiom Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop release version (for example 0.4.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build standalone Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Axiom desktop UI
        run: pnpm run build:webview

      - name: Validate desktop launcher
        run: node --check desktop/main.cjs

      - name: Install desktop packaging dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Validate release version
        shell: pwsh
        run: |
          $version = if ("\${{ github.event_name }}" -eq "workflow_dispatch") { "\${{ inputs.version }}" } else { "\${{ github.ref_name }}".TrimStart("v") }
          $manifestVersion = (Get-Content "desktop/package.json" -Raw | ConvertFrom-Json).version
          if ($version -ne $manifestVersion) { throw "Release version $version does not match desktop/package.json version $manifestVersion" }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }
          "AXIOM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: Upload standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: axiom-standalone-windows-\${{ env.AXIOM_VERSION }}
          path: desktop/release/Axiom-Setup-*-x64.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Axiom \${{ env.AXIOM_VERSION }}
          generate_release_notes: true
          files: desktop/release/Axiom-Setup-*-x64.exe
