name: Publish Axiom Android release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-release.yml"
      - "pwa/**"

permissions:
  contents: write

concurrency:
  group: axiom-android-public-release
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run unit tests
        run: npm test

      - name: Build production PWA
        run: npm run build

      - name: Install Chromium for mobile browser tests
        run: npx playwright install chromium

      - name: Run mobile browser tests
        run: npm run test:e2e:mobile

  publish:
    name: Build and publish Android APK
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Android release version
        id: version
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./pwa/package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid Android release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install Vulkan build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          for attempt in 1 2 3; do
            echo "Installing Vulkan dependencies (attempt ${attempt}/3)"
            if timeout --kill-after=10s 60s sudo apt-get "${apt_options[@]}" update &&
              timeout --kill-after=10s 90s sudo apt-get "${apt_options[@]}" install -y libvulkan-dev glslc spirv-headers; then
              echo "AXIOM_ENABLE_VULKAN=1" >> "$GITHUB_ENV"
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "Ubuntu package mirrors are unavailable; retrying in 15 seconds."
              sleep 15
            fi
          done
          echo "::warning::Vulkan host dependencies could not be downloaded. Building the supported CPU backend instead."
          echo "AXIOM_ENABLE_VULKAN=0" >> "$GITHUB_ENV"

      - name: Locate host SPIR-V headers CMake package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${AXIOM_ENABLE_VULKAN:-1}" == "1" ]]; then
            config="$(find /usr -name SPIRV-HeadersConfig.cmake -print -quit)"
            test -n "$config" || { echo "SPIRV-Headers CMake package was not installed"; exit 1; }
            echo "SPIRV_HEADERS_CMAKE_DIR=$(dirname "$config")" >> "$GITHUB_ENV"
          else
            echo "Skipping host Vulkan header setup because the CPU backend was selected."
          fi
      - name: Install dependencies
        working-directory: pwa
        run: npm ci

      - name: Build web application
        working-directory: pwa
        run: npm run build

      - name: Generate Android project
        working-directory: pwa
        run: |
          npx cap add android
          npx cap sync android

      - name: Install Axiom native runtime
        working-directory: pwa
        run: node scripts/install-android-native.mjs

      - name: Build installable Android APK
        working-directory: pwa/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp pwa/android/app/build/outputs/apk/debug/app-debug.apk release/Axiom-Android-arm64-debug.apk

      - name: Attach APK to public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Axiom Android ${{ steps.version.outputs.version }}
          body_path: pwa/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release/Axiom-Android-arm64-debug.apk
          fail_on_unmatched_files: true
