name: Publish Axiom Android release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-release.yml"
      - "pwa/RELEASE_NOTES.md"
      - "pwa/tests/mobile-e2e/**"

permissions:
  contents: write

concurrency:
  group: axiom-android-public-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Android release candidate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run unit tests
        run: npm test

      - name: Build production PWA
        run: npm run build

      - name: Install Chromium for mobile browser tests
        run: npx playwright install --with-deps chromium

      - name: Run mobile browser tests
        run: npm run test:e2e:mobile

  publish:
    name: Publish public GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Create Android GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.0
          target_commitish: ${{ github.sha }}
          name: Axiom Android 1.1.0
          body_path: pwa/RELEASE_NOTES.md
          draft: false
          prerelease: false
