name: Android APK release
on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - ".github/workflows/android-release.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: axiom-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install Vulkan build dependencies
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc spirv-headers
      - name: Locate host SPIR-V headers CMake package
        run: |
          config="$(find /usr -name SPIRV-HeadersConfig.cmake -print -quit)"
          test -n "$config" || { echo "SPIRV-Headers CMake package was not installed"; exit 1; }
          echo "SPIRV_HEADERS_CMAKE_DIR=$(dirname "$config")" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Run unit tests
        run: npm test
      - name: Build web application
        run: npm run build
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Install Axiom native runtime
        run: node scripts/install-android-native.mjs
      - name: Build installable Android APK
        working-directory: pwa/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Prepare APK
        working-directory: .
        run: |
          mkdir -p release
          cp pwa/android/app/build/outputs/apk/debug/app-debug.apk release/Axiom-Android-arm64-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-Android-arm64-${{ github.ref_name }}
          path: release/Axiom-Android-arm64-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          name: Axiom Android ${{ github.ref_name }}
          generate_release_notes: true
          files: release/Axiom-Android-arm64-debug.apk
          fail_on_unmatched_files: true
