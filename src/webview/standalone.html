<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101116" />
    <meta name="description" content="Axiom, an AI-first standalone project-building workspace." />
    <title>Axiom</title>
    <script>
      // Desktop builds pass the selected workspace and local runtime URL as query parameters.
      // The localhost default is retained for standalone browser development and E2E tests.
      const params = new URLSearchParams(window.location.search);
      window.OPENCODE_CONFIG = {
        serverUrl: params.get("serverUrl") || "http://127.0.0.1:8787",
        workspaceRoot: params.get("workspaceRoot") || undefined,
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
