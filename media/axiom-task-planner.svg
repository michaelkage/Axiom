<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Axiom task planner interface preview</title><desc id="desc">Illustrative Axiom desktop workspace with a project plan, parallel tasks, acceptance criteria and execution progress.</desc>
