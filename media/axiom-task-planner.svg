<rect width="1440" height="900" rx="28" fill="url(#bg)"/><rect x="0" y="0" width="1440" height="64" rx="28" fill="#171f30"/><path d="M0 64h1440" stroke="#2c3850"/>
<circle cx="34" cy="32" r="9" fill="#8b9bff"/><text x="58" y="39" fill="#f3f5fb" font-family="Inter,Arial" font-size="22" font-weight="700">Axiom</text><text x="1320" y="39" fill="#9ca9c0" font-family="Inter,Arial" font-size="14">PROJECT WORKSPACE</text>
<rect x="28" y="90" width="270" height="780" rx="18" fill="#151e2e" stroke="#2b3850"/><text x="54" y="132" fill="#94a3b8" font-family="Inter,Arial" font-size="13" letter-spacing="2">WORKSPACE</text><text x="54" y="174" fill="#f8fafc" font-family="Inter,Arial" font-size="19" font-weight="600">Project Atlas</text><rect x="48" y="198" width="230" height="42" rx="9" fill="#26324a"/><text x="68" y="225" fill="#dbe3f4" font-family="Inter,Arial" font-size="15">✦  Task planner</text><text x="68" y="278" fill="#9ca9c0" font-family="Inter,Arial" font-size="15">▤  Files</text><text x="68" y="322" fill="#9ca9c0" font-family="Inter,Arial" font-size="15">⌘  Terminal</text><text x="68" y="366" fill="#9ca9c0" font-family="Inter,Arial" font-size="15">◈  Project intelligence</text><rect x="48" y="770" width="230" height="72" rx="10" fill="#1d2940"/><circle cx="70" cy="796" r="6" fill="#46c89a"/><text x="88" y="802" fill="#d9e3f3" font-family="Inter,Arial" font-size="14">Runtime connected</text><text x="68" y="826" fill="#8493ad" font-family="Inter,Arial" font-size="12">Local workspace · Ready</text>
<text x="344" y="130" fill="#f8fafc" font-family="Inter,Arial" font-size="31" font-weight="700">Build a feature, end to end.</text><text x="344" y="164" fill="#9aa8c0" font-family="Inter,Arial" font-size="16">A clear plan before execution. Reviewable work at every step.</text>
<rect x="344" y="194" width="1060" height="110" rx="16" fill="#182337" stroke="#34435f"/><text x="374" y="232" fill="#aab7cc" font-family="Inter,Arial" font-size="13" letter-spacing="1.5">CURRENT REQUEST</text><text x="374" y="268" fill="#f0f4fc" font-family="Inter,Arial" font-size="19">Add CSV export to reports, include tests, and verify the result.</text><rect x="1260" y="220" width="112" height="44" rx="10" fill="url(#accent)"/><text x="1283" y="248" fill="#fff" font-family="Inter,Arial" font-size="15" font-weight="700">Plan work</text>
<text x="344" y="360" fill="#f8fafc" font-family="Inter,Arial" font-size="21" font-weight="700">Execution plan</text><text x="344" y="388" fill="#91a0b8" font-family="Inter,Arial" font-size="14">3 scoped tasks · acceptance criteria defined · dependencies mapped</text>
<rect x="344" y="416" width="1060" height="120" rx="14" fill="#151f31" stroke="#35425b"/><circle cx="380" cy="454" r="15" fill="#26385b"/><text x="375" y="460" fill="#c4ceff" font-family="Inter,Arial" font-size="14" font-weight="700">1</text><text x="414" y="456" fill="#eef2fa" font-family="Inter,Arial" font-size="18" font-weight="600">Implement export endpoint</text><text x="414" y="484" fill="#91a0b8" font-family="Inter,Arial" font-size="14">Define CSV schema, stream rows, handle empty results.</text><rect x="1196" y="438" width="172" height="30" rx="15" fill="#193d37"/><text x="1220" y="458" fill="#7de0b7" font-family="Inter,Arial" font-size="12">READY TO EXECUTE</text><text x="414" y="516" fill="#9ca9c0" font-family="Inter,Arial" font-size="12">Acceptance: valid CSV · stable headers · no unbounded memory use</text>
<rect x="344" y="552" width="1060" height="120" rx="14" fill="#151f31" stroke="#35425b"/><circle cx="380" cy="590" r="15" fill="#26385b"/><text x="375" y="596" fill="#c4ceff" font-family="Inter,Arial" font-size="14" font-weight="700">2</text><text x="414" y="592" fill="#eef2fa" font-family="Inter,Arial" font-size="18" font-weight="600">Add export controls to reports UI</text><text x="414" y="620" fill="#91a0b8" font-family="Inter,Arial" font-size="14">Add an accessible action and connect it to the endpoint.</text><rect x="1196" y="574" width="172" height="30" rx="15" fill="#26324b"/><text x="1235" y="594" fill="#b6c5e5" font-family="Inter,Arial" font-size="12">QUEUED</text><text x="414" y="652" fill="#9ca9c0" font-family="Inter,Arial" font-size="12">Depends on task 1 · Scope: reports components and tests</text>
<rect x="344" y="688" width="1060" height="120" rx="14" fill="#151f31" stroke="#35425b"/><circle cx="380" cy="726" r="15" fill="#26385b"/><text x="375" y="732" fill="#c4ceff" font-family="Inter,Arial" font-size="14" font-weight="700">3</text><text x="414" y="728" fill="#eef2fa" font-family="Inter,Arial" font-size="18" font-weight="600">Verify behavior and update docs</text><text x="414" y="756" fill="#91a0b8" font-family="Inter,Arial" font-size="14">Run targeted tests, inspect the diff, and record evidence.</text><rect x="1196" y="710" width="172" height="30" rx="15" fill="#26324b"/><text x="1235" y="730" fill="#b6c5e5" font-family="Inter,Arial" font-size="12">BLOCKED</text><text x="414" y="788" fill="#9ca9c0" font-family="Inter,Arial" font-size="12">Depends on tasks 1 and 2 · Verification evidence required</text>
<text x="344" y="850" fill="#71819c" font-family="Inter,Arial" font-size="13">ILLUSTRATIVE INTERFACE PREVIEW · NOT A PRODUCT SCREENSHOT</text>
